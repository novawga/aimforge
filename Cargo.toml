[package]
name = "aimforge"
version = "0.6.0"
edition = "2021"
description = "A KovaaK's-style 3D aim trainer: flicks, tracking, target switching, click timing and strafe aim, driven by editable scenario files."
license = "MIT"

[[bin]]
name = "aimforge"
path = "src/main.rs"

[features]
default = ["audio"]
# Hit / kill sounds. Turn off with `--no-default-features` on Linux boxes without ALSA headers.
audio = ["macroquad/audio"]

[dependencies]
macroquad = { version = "0.4", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = { version = "1.13.2", default-features = false, features = ["std", "unicode-perl"] }
ureq = { version = "2", default-features = false, features = ["tls", "native-certs", "gzip"] }
sha2 = "0.11.1"
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }
flate2 = "1.1.11"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
